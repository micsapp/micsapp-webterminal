server {
    listen 7680;
    server_name mics5070wsl.micstec.com;

    absolute_redirect off;

    # Security headers for this app come from auth.py, not nginx. This one
    # add_header exists to BREAK INHERITANCE of any http{}-level add_header
    # set by the host's global nginx config (nginx replaces ALL inherited
    # add_headers once a block defines any of its own). Without it, e.g.
    # TerraMaster TOS injects its portal CSP ("default-src 'self'
    # *.terra-master.com ...", no frame-src) and X-Frame-Options SAMEORIGIN
    # onto every response here; browsers enforce the intersection of all CSP
    # headers, which blocked embedding peer web terminals ("This content is
    # blocked") and blocked peers from embedding this one. On hosts with no
    # http-level add_header this is a harmless duplicate of auth.py's header.
    add_header X-Content-Type-Options nosniff always;

    # Auth subrequest
    location = /api/auth {
        internal;
        proxy_pass http://127.0.0.1:7682;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # Pass Authorization header so bearer tokens work for API scripting.
        proxy_set_header Authorization $http_authorization;
        # Used by auth.py to authorize /ut/<port>/ access (prevents cross-user port access).
        proxy_set_header X-TTYD-Port $ttyd_port;
        # Must match the largest client_max_body_size of any location using auth_request,
        # because nginx checks this limit on the subrequest before stripping the body.
        client_max_body_size 40m;
    }

    # Login page and login API (no auth required)
    location /login {
        proxy_pass http://127.0.0.1:7682;
    }
    location /api/login {
        proxy_pass http://127.0.0.1:7682;
    }

    # PWA assets (no auth required — manifest, service worker, icons, offline page)
    location ~ ^/(manifest\.webmanifest|sw\.js|offline\.html|icon\.svg|icon-192\.png|icon-512\.png|apple-touch-icon\.png)$ {
        proxy_pass http://127.0.0.1:7682;
    }

    # File browser API (requires auth)
    location /api/files/ {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 40m;
    }

    # Shell command execution (requires auth)
    location = /api/exec {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 64k;
    }

    # Interactive shell over WebSocket (requires auth)
    location = /api/shell {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Pass Authorization header so bearer tokens reach auth.py.
        proxy_set_header Authorization $http_authorization;
        # Disable buffering so PTY output reaches the client immediately.
        proxy_buffering off;
        proxy_request_buffering off;
        # Long-lived connection: no timeouts mid-session.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API token management (requires auth)
    location /api/tokens {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
    }

    # Quick commands API (requires auth)
    location /api/quick-commands {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 8m;
    }

    # Persistent session notes (requires auth)
    location = /api/notes {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 64k;
    }

    # Complete note voice recordings (requires auth; local Whisper transcription)
    location = /api/transcribe {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }

    # Per-user shared settings (e.g. browser tab-title) (requires auth)
    location = /api/settings {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 64k;
    }

    # Remote SSH server catalog and tab creation (requires auth)
    location = /api/servers {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
    }
    location = /api/server-status {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        # Probing every endpoint can outlast the default 60s read timeout when
        # several are unreachable and each waits out WEBTERMINAL_SERVER_STATUS_TIMEOUT.
        proxy_read_timeout 90s;
    }
    location = /api/remote-tab {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
        client_max_body_size 16k;
    }

    # Wrapper app page (requires auth)
    location = / {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682/app;
    }

    # Per-user ttyd instances (dynamic port from URL path). Use named
    # captures: positional $1/$2 are the *last executed regex* in nginx and get
    # clobbered (e.g. by the PCRE2-patched 1.24.0 build shipping on Ubuntu
    # 24.04/26.04, or by auth_request subrequest regex evaluation), which made
    # X-TTYD-Port carry "/ut/" instead of the port and bounced every terminal
    # iframe back to /login.
    location ~ ^/ut/(?<ttyd_port>\d+)/(?<ttyd_path>.*) {
        auth_request /api/auth;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:$ttyd_port/$ttyd_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Allow sub_filter to operate (disable upstream compression).
        proxy_set_header Accept-Encoding "";

        # Inject a helper script into ttyd HTML so the iframe exposes the xterm instance.
        # Use an external script (same-origin) to avoid CSP issues with inline scripts.
        sub_filter_once on;
        sub_filter '</head>' '<script src="/api/term-hook.js"></script></head>';
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Helper script used by /ut/... injection (requires auth)
    location = /api/term-hook.js {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
    }

    # Desktop API (requires auth)
    location = /api/desktop {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
    }

    # Help manual (requires auth)
    location /api/help {
        auth_request /api/auth;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:7682;
    }

    # noVNC — proxy to existing noVNC/websockify on port 6080
    location /noVNC/ {
        auth_request /api/auth;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Per-user noVNC websocket bridge returned by /api/desktop.
    location ~ ^/vnc-ws/(?<vnc_port>\d+)/(?<vnc_path>.*) {
        auth_request /api/auth;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:$vnc_port/$vnc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location @login_redirect {
        return 302 /login;
    }
}
